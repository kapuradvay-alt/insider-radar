# Every weekday evening (US time) this job fetches the new SEC Form 4 filings, rebuilds the
# signal list for the app, and saves the result back into the repository.
# It can also be started by hand: GitHub > Actions > Daily update > Run workflow.
name: Daily update

on:
  schedule:
    - cron: "30 4 * * 2-6"      # 04:30 UTC, Tuesday to Saturday = after the SEC posts Mon-Fri filing lists
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-update.txt

      - run: pip install -r requirements-update.txt

      - name: Fetch new SEC filings (days already saved are skipped)
        env:
          SEC_EMAIL: ${{ secrets.SEC_EMAIL }}
        run: |
          test -n "$SEC_EMAIL" || { echo "Secret SEC_EMAIL is missing"; exit 1; }
          python src/live_form4.py "$SEC_EMAIL" 2026-10-01 "$(date -u -d yesterday +%F)"
          python src/live_status.py 2026-10-01 "$(date -u -d yesterday +%F)" || true

      - name: Rebuild the signal list (stops without changes if Yahoo prices are missing)
        run: python src/make_live_data.py

      - name: Save results to the repository
        run: |
          git config user.name "insider-radar bot"
          git config user.email "actions@users.noreply.github.com"
          git add app_data data/live
          if git diff --staged --quiet; then
            echo "Nothing new to save."
          else
            git commit -m "Daily update $(date -u +%F)"
            git push
          fi
